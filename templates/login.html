<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login | WaitWise AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-body">

    <div class="login-wrapper">

        <div class="login-brand">
            <div class="logo-large">⏱</div>
            <h1>WaitWise<span> AI</span></h1>
            <p>Smart Restaurant Management</p>
        </div>

        <div class="login-card">
            <span class="section-label">OWNER ACCESS</span>
            <h2>Welcome back</h2>
            <p>Access your restaurant crowd dashboard.</p>

            <form action="/owner" method="GET">
                <div class="form-group">
                    <label>Email Address</label>
                    <input
                        type="email"
                        value="owner@foodpalace.com"
                        placeholder="Enter email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input
                        type="password"
                        value="demo123"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button type="submit" class="primary-btn full-btn">
                    Enter Dashboard →
                </button>
            </form>

            <div class="demo-login">
                <strong>Demo Account</strong>
                <span>owner@foodpalace.com</span>
                <span>Password: demo123</span>
            </div>

            <a href="/" class="back-link center">
                ← Back to Home
            </a>
        </div>

    </div>

</body>

</html>
